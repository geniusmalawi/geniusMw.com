<!DOCTYPE html>
<html lang="en" data-accessibility="default" data-font-size="medium">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Genius Malawi</title>
    <meta name="description" content="Set a new secure password for your Genius Malawi account.">
    
    <!-- Favicon Links -->
    <link rel="icon" type="image/png" href="../assets/Icon.png">
    <link rel="apple-touch-icon" href="../assets/Icon.png">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

    <!-- ==========================================
         1. ANIMATED SPLASH SCREEN / LOADER
         ========================================== -->
    <div id="reset-splash" class="splash-screen">
        <div class="splash-logo-container">
            <img src="../assets/Logo.png" alt="Reset Password Loading" class="splash-logo">
        </div>
        <div class="splash-loader"></div>
    </div>

    <!-- ==========================================
         2. RESET PASSWORD PANEL SECTION
         ========================================== -->
    <main style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 16px;">
        <div class="luxury-card" style="width: 100%; max-width: 480px; padding: 40px 32px;">
            <div style="text-align: center; margin-bottom: 32px;">
                <a href="../index.html">
                    <img src="../assets/Logo.png" alt="Genius Malawi Logo" style="height: 60px; width: auto; margin-bottom: 16px;">
                </a>
                <h1 style="font-size: 24px; margin-bottom: 8px;">Create New Password</h1>
                <p style="color: var(--text-muted); font-size: 14px;">Establish a secure password for account authentication.</p>
            </div>

            <!-- Error/Status Alerts Box -->
            <div id="reset-alert" style="display: none; padding: 12px 16px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 20px; text-align: center;"></div>

            <!-- Reset Form -->
            <form id="reset-form">
                <div class="form-group">
                    <label class="form-label" for="reset-password">New Password</label>
                    <input type="password" id="reset-password" class="form-control" autocomplete="new-password" required>
                    <span style="display: block; font-size: 11px; color: var(--text-muted); margin-top: 6px;">Must consist of at least 6 characters.</span>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="reset-confirm">Confirm Password</label>
                    <input type="password" id="reset-confirm" class="form-control" autocomplete="new-password" required>
                </div>
                
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 12px;">Update Password</button>
            </form>
        </div>
    </main>

    <!-- Footer Copyright Only -->
    <footer style="text-align: center; padding: 24px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--gold-translucent);">
        &copy; 2026 Genius Malawi. All secure rights reserved.
    </footer>

    <!-- Scripts -->
    <script type="module" src="../js/reset-password.js"></script>
</body>
</html>
