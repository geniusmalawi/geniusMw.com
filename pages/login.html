<!DOCTYPE html>
<html lang="en" data-accessibility="default" data-font-size="medium">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
    <title>Login - Genius Malawi</title>
    <meta name="description" content="Securely log in to your Genius Malawi account. Connect, trade, find employment, access AI services, and stream media.">
    
    <!-- Favicon Links -->
    <link rel="icon" type="image/png" href="../assets/Icon.png?v=2">
    <link rel="apple-touch-icon" href="../assets/Icon.png?v=2">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/style.css?v=2.0.2">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

    <!-- ==========================================
         1. ANIMATED SPLASH SCREEN / LOADER
         ========================================== -->
    <div id="login-splash" class="splash-screen">
        <div class="splash-logo-container">
            <img src="../assets/Logo.png?v=2" alt="Genius Malawi Logo" class="splash-logo">
        </div>
        <div class="splash-loader"></div>
    </div>

    <!-- ==========================================
         2. LOGIN PANEL SECTION
         ========================================== -->
    <main style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 16px;">
        <div class="luxury-card" style="width: 100%; max-width: 480px; padding: 40px 32px;">
            <div style="text-align: center; margin-bottom: 32px;">
                <a href="/">
                    <img src="../assets/Logo.png" alt="Genius Malawi Logo" style="height: 60px; width: auto; margin-bottom: 16px;">
                </a>
                <h1 style="font-size: 24px; margin-bottom: 8px;">Access Your Account</h1>
                <p style="color: var(--text-muted); font-size: 14px;">Connecting Malawi. Empowering Every Dream.</p>
            </div>

            <!-- Login Method Toggle Tabs -->
            <div style="display: flex; margin-bottom: 24px; border-bottom: 1px solid var(--gold-translucent);">
                <button id="tab-email" class="btn-secondary" style="flex: 1; border: none; border-bottom: 2px solid var(--gold-base); border-radius: 0; padding: 12px 0; font-size: 13px; text-transform: uppercase;">Email Sign-In</button>
                <button id="tab-phone" class="btn-secondary" style="flex: 1; border: none; border-radius: 0; padding: 12px 0; font-size: 13px; text-transform: uppercase; color: var(--text-muted);">Phone OTP</button>
            </div>

            <!-- Error/Status Alerts Box -->
            <div id="auth-alert" style="display: none; padding: 12px 16px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 20px; text-align: center;"></div>

            <!-- Form A: Email & Password -->
            <form id="email-login-form">
                <div class="form-group">
                    <label class="form-label" for="login-email">Email Address</label>
                    <input type="email" id="login-email" class="form-control" autocomplete="username" required>
                </div>
                <div class="form-group" style="position: relative;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <label class="form-label" for="login-password" style="margin-bottom: 0;">Password</label>
                        <a href="forgot-password.html" style="font-size: 12px; color: var(--gold-light);">Forgot?</a>
                    </div>
                    <input type="password" id="login-password" class="form-control" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 12px;">Sign In Securely</button>
            </form>

            <!-- Form B: Phone OTP (Initially Hidden) -->
            <form id="phone-login-form" style="display: none;">
                <!-- Phone input step -->
                <div id="phone-number-step">
                    <div class="form-group">
                        <label class="form-label" for="login-phone">Malawi Phone Number</label>
                        <input type="tel" id="login-phone" class="form-control" placeholder="+265..." autocomplete="tel">
                        <span style="display: block; font-size: 11px; color: var(--text-muted); margin-top: 6px;">Format must include your country code: +265XXXXXXXXX</span>
                    </div>
                    <button type="button" id="send-otp-btn" class="btn-primary" style="width: 100%; margin-top: 12px;">Send Verification Code</button>
                </div>

                <!-- OTP verification step (Initially Hidden) -->
                <div id="phone-otp-step" style="display: none;">
                    <div class="form-group">
                        <label class="form-label" for="login-otp">6-Digit Verification Code</label>
                        <input type="text" id="login-otp" class="form-control" placeholder="000000" maxlength="6" inputmode="numeric">
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%; margin-top: 12px;">Verify Code & Sign In</button>
                    <button type="button" id="change-phone-btn" class="btn-secondary" style="width: 100%; margin-top: 12px; border-color: transparent;">Use Different Number</button>
                </div>
            </form>

            <!-- Social SSO Logins Divider -->
            <div style="display: flex; align-items: center; margin: 32px 0 24px;">
                <hr style="flex: 1; border: none; border-top: 1px solid var(--gold-translucent);">
                <span style="font-size: 12px; color: var(--text-muted); padding: 0 16px; text-transform: uppercase;">Or Authenticate with</span>
                <hr style="flex: 1; border: none; border-top: 1px solid var(--gold-translucent);">
            </div>

            <!-- SSO Buttons -->
            <div style="display: flex; gap: 16px;">
                <button id="sso-google" class="btn-secondary" style="flex: 1; font-size: 13px; text-transform: none; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    Google
                </button>
                <button id="sso-facebook" class="btn-secondary" style="flex: 1; font-size: 13px; text-transform: none; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    Facebook
                </button>
            </div>

            <!-- Platform Invitation Link -->
            <div style="text-align: center; margin-top: 32px; font-size: 14px;">
                <span style="color: var(--text-muted);">New to the super platform?</span>
                <a href="register.html" style="font-weight: 600; margin-left: 6px;">Register Here</a>
            </div>
        </div>
    </main>

    <!-- Footer Copyright Only -->
    <footer style="text-align: center; padding: 24px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--gold-translucent);">
        &copy; 2026 Genius Malawi. All secure rights reserved.
    </footer>

    <!-- Scripts -->
    <script type="module" src="../js/login.js?v=2.0.2"></script>
</body>
</html>
