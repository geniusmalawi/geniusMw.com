<!DOCTYPE html>
<html lang="en" data-accessibility="default" data-font-size="medium">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Center - Genius Malawi</title>
    <meta name="description" content="Stream live Malawian TV, listen to local live radio, enjoy original videos, and stream music on the Genius Malawi Premium Entertainment Hub.">
    
    <!-- Favicon Links -->
    <link rel="icon" type="image/png" href="../assets/Icon.png?v=2">
    <link rel="apple-touch-icon" href="../assets/Icon.png?v=2">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/style.css?v=2.0.2">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; overflow: hidden;">

    <!-- ==========================================
         1. ANIMATED SPLASH SCREEN / LOADER
         ========================================== -->
    <div id="media-splash" class="splash-screen">
        <div class="splash-logo-container">
            <img src="../assets/Logo.png?v=2" alt="Media Center Loading" class="splash-logo">
        </div>
        <div class="splash-loader"></div>
    </div>

    <!-- ==========================================
         2. CORE NAVIGATION BAR
         ========================================== -->
    <header class="luxury-card" style="border-radius: 0; border-top: none; border-left: none; border-right: none; padding: 12px 24px; z-index: 10;">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div style="display: flex; align-items: center; gap: 16px;">
                <a href="/">
                    <img src="../assets/Logo.png" alt="Genius Malawi Logo" style="height: 40px; width: auto;">
                </a>
                <span style="font-size: 14px; color: var(--text-muted); border-left: 1px solid var(--gold-translucent); padding-left: 16px;">Premium Entertainment Hub</span>
            </div>
            <a href="/" class="btn-secondary" style="padding: 8px 16px; font-size: 12px;">Back to Dashboard</a>
        </div>
    </header>

    <!-- ==========================================
         3. WORKSPACE CONTAINER (TABS & PLAYERS)
         ========================================== -->
    <div style="flex: 1; display: flex; overflow: hidden; position: relative;">
        
        <!-- Sidebar Navigation (Switch Media Tiers) -->
        <aside class="luxury-card" style="width: 260px; border-radius: 0; border-top: none; border-bottom: none; border-left: none; display: flex; flex-direction: column; padding: 20px 16px; z-index: 5;">
            <div style="margin-bottom: 24px;">
                <h3 style="font-size: 18px; margin-bottom: 4px;">Media Hub</h3>
                <p style="color: var(--text-muted); font-size: 12px;">Malawian Broadcast & Music</p>
            </div>

            <!-- Tab Selectors -->
            <div style="display: flex; flex-direction: column; gap: 10px; flex: 1;">
                <button id="tab-live-tv" class="btn-secondary" style="width: 100%; border-color: var(--gold-base); text-transform: none; text-align: left; padding: 12px 16px;">📺 Live TV</button>
                <button id="tab-live-radio" class="btn-secondary" style="width: 100%; border-color: transparent; text-transform: none; text-align: left; padding: 12px 16px; color: var(--text-muted);">📻 Live Radio</button>
                <button id="tab-videos" class="btn-secondary" style="width: 100%; border-color: transparent; text-transform: none; text-align: left; padding: 12px 16px; color: var(--text-muted);">🎬 Original Videos</button>
                <button id="tab-music" class="btn-secondary" style="width: 100%; border-color: transparent; text-transform: none; text-align: left; padding: 12px 16px; color: var(--text-muted);">🎵 Music Streaming</button>
                <!-- Football Live removed: only TV, Radio, Videos, Music are available -->
            </div>
        </aside>

        <!-- Main Display Arena (Interactive Players Grid) -->
        <main style="flex: 1; display: flex; flex-direction: column; background: rgba(5,5,5,0.4); overflow-y: auto; position: relative; padding: 32px 24px 100px;">
            
            <!-- Context Title -->
            <div style="margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center;">
                <h2 id="media-viewport-title" class="gold-text-gradient" style="font-size: 24px;">Live Television Streams</h2>
                <span class="badge badge-premium" id="media-viewport-badge">Live Broadcasts</span>
            </div>

            <!-- Active Streams Canvas Grid -->
            <div id="media-viewport-grid" class="grid grid-cols-3" style="gap: 24px;">
                <!-- Dynamically populated via media.js controller -->
                <p style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 40px;">Initializing media channels...</p>
            </div>

        </main>
    </div>

    <!-- ==========================================
         4. FLOATING UNIVERSAL MEDIA PLAYER BAR (Music / Radio)
         ========================================== -->
    <div id="floating-media-player" class="luxury-card" style="position: fixed; bottom: 0; left: 0; width: 100vw; border-radius: 0; border-bottom: none; border-left: none; border-right: none; border-top: 1px solid var(--gold-base); padding: 16px 32px; z-index: 100; display: none; align-items: center; justify-content: space-between; background: rgba(10,10,12,0.95); backdrop-filter: blur(20px);">
        <div style="display: flex; align-items: center; gap: 16px; min-width: 240px; max-width: 320px;">
            <div style="width: 44px; height: 44px; border-radius: var(--radius-sm); background: var(--gold-translucent); border: var(--glass-border); display: flex; align-items: center; justify-content: center; font-size: 18px;" id="player-avatar">🎵</div>
            <div style="overflow: hidden;">
                <strong id="player-title" style="display: block; font-size: 14px; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">No active track</strong>
                <span id="player-artist" style="display: block; font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Genius Malawi Streams</span>
            </div>
        </div>

        <!-- Controls center -->
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; max-width: 450px;">
            <div style="display: flex; align-items: center; gap: 20px;">
                <button id="player-prev-btn" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:16px;">⏮</button>
                <button id="player-play-btn" style="background:var(--gold-gradient); border:none; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#000; font-weight:bold; cursor:pointer; font-size:14px;">▶</button>
                <button id="player-next-btn" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:16px;">⏭</button>
            </div>
            <!-- Progress sliders (mock for live streams, active for music) -->
            <div style="display: flex; align-items: center; gap: 10px; width: 100%;">
                <span id="player-current-time" style="font-size: 11px; color: var(--text-muted);">00:00</span>
                <input type="range" id="player-progress-bar" style="flex: 1; accent-color: var(--gold-base); height: 4px; cursor: pointer;" min="0" max="100" value="0">
                <span id="player-total-time" style="font-size: 11px; color: var(--text-muted);">00:00</span>
            </div>
        </div>

        <!-- Volume controls -->
        <div style="display: flex; align-items: center; gap: 10px; min-width: 150px; justify-content: flex-end;">
            <span style="font-size:14px;">🔊</span>
            <input type="range" id="player-volume-bar" style="width: 100px; accent-color: var(--gold-base); height: 4px; cursor: pointer;" min="0" max="1" step="0.1" value="0.8">
        </div>

        <!-- HTML5 Audio Core Element wrapper -->
        <audio id="core-audio-element" style="display: none;"></audio>
    </div>

    <!-- Script Import -->
    <script type="module" src="../js/media.js?v=2.0.2"></script>
    <script type="module" src="../js/advertising.js?v=2.0.2"></script>
</body>
</html>
