<!DOCTYPE html>
<html lang="en" data-accessibility="default" data-font-size="medium">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Genius Malawi</title>
    <meta name="description" content="Recover your Genius Malawi account password securely through our registered email verification systems.">
    
    <!-- Favicon Links -->
    <link rel="icon" type="image/png" href="../assets/Icon.png?v=2">
    <link rel="apple-touch-icon" href="../assets/Icon.png?v=2">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

    <!-- ==========================================
         1. ANIMATED SPLASH SCREEN / LOADER
         ========================================== -->
    <div id="forgot-splash" class="splash-screen">
        <div class="splash-logo-container">
            <img src="../assets/Logo.png?v=2" alt="Recovery Loading" class="splash-logo">
        </div>
        <div class="splash-loader"></div>
    </div>

    <!-- ==========================================
         2. RECOVERY PANEL SECTION
         ========================================== -->
    <main style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 16px;">
        <div class="luxury-card" style="width: 100%; max-width: 480px; padding: 40px 32px;">
            <div style="text-align: center; margin-bottom: 32px;">
                <a href="../index.html">
                    <img src="../assets/Logo.png?v=2" alt="Genius Malawi Logo" style="height: 60px; width: auto; margin-bottom: 16px;">
                </a>
                <h1 style="font-size: 24px; margin-bottom: 8px;">Recover Password</h1>
                <p style="color: var(--text-muted); font-size: 14px;">Enter your email to receive a password reset key link.</p>
            </div>

            <!-- Error/Status Alerts Box -->
            <div id="recovery-alert" style="display: none; padding: 12px 16px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 20px; text-align: center;"></div>

            <!-- Recovery Form -->
            <form id="recovery-form">
                <div class="form-group">
                    <label class="form-label" for="recovery-email">Email Address</label>
                    <input type="email" id="recovery-email" class="form-control" autocomplete="username" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 12px;">Send Reset Link</button>
            </form>

            <!-- Navigation Links -->
            <div style="text-align: center; margin-top: 32px; font-size: 14px;">
                <span style="color: var(--text-muted);">Remembered your details?</span>
                <a href="login.html" style="font-weight: 600; margin-left: 6px;">Sign In</a>
            </div>
        </div>
    </main>

    <!-- Footer Copyright Only -->
    <footer style="text-align: center; padding: 24px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--gold-translucent);">
        &copy; 2026 Genius Malawi. All secure rights reserved.
    </footer>

    <!-- Scripts -->
    <script type="module" src="../js/forgot-password.js"></script>
</body>
</html>
