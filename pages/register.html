<!DOCTYPE html>
<html lang="en" data-accessibility="default" data-font-size="medium">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Genius Malawi</title>
    <meta name="description" content="Register an account on Genius Malawi. Claim your unique Genius ID and unlock AI features, job applications, and news publishing.">
    
    <!-- Favicon Links -->
    <link rel="icon" type="image/png" href="../assets/Icon.png?v=2">
    <link rel="apple-touch-icon" href="../assets/Icon.png?v=2">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

    <!-- ==========================================
         1. ANIMATED SPLASH SCREEN / LOADER
         ========================================== -->
    <div id="register-splash" class="splash-screen">
        <div class="splash-logo-container">
            <img src="../assets/Logo.png?v=2" alt="Genius Malawi Logo" class="splash-logo">
        </div>
        <div class="splash-loader"></div>
    </div>

    <!-- ==========================================
         2. REGISTRATION PANEL SECTION
         ========================================== -->
    <main style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 16px;">
        <div class="luxury-card" style="width: 100%; max-width: 520px; padding: 40px 32px;">
            <div style="text-align: center; margin-bottom: 32px;">
                <a href="../index.html">
                    <img src="../assets/Logo.png" alt="Genius Malawi Logo" style="height: 60px; width: auto; margin-bottom: 16px;">
                </a>
                <h1 style="font-size: 24px; margin-bottom: 8px;">Create New Account</h1>
                <p style="color: var(--text-muted); font-size: 14px;">Join the biggest digital super platform in Malawi.</p>
            </div>

            <!-- Error/Status Alerts Box -->
            <div id="register-alert" style="display: none; padding: 12px 16px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 20px; text-align: center;"></div>

            <!-- Sign Up Form -->
            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="reg-fullname">Full Name</label>
                    <input type="text" id="reg-fullname" class="form-control" placeholder="John Doe" autocomplete="name" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="yourname@gmail.com" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-phone">Phone Number (Optional)</label>
                    <input type="tel" id="reg-phone" class="form-control" placeholder="+265..." autocomplete="tel">
                    <span style="display: block; font-size: 11px; color: var(--text-muted); margin-top: 6px;">Recommended format: +265XXXXXXXXX</span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-password">Password</label>
                    <input type="password" id="reg-password" class="form-control" autocomplete="new-password" required>
                    <span style="display: block; font-size: 11px; color: var(--text-muted); margin-top: 6px;">Must consist of at least 6 characters.</span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-referral">Referral Code (Optional)</label>
                    <input type="text" id="reg-referral" class="form-control" placeholder="E.g., 5A2C8F3B">
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 12px;">Complete Registration</button>
            </form>

            <!-- Social SSO Logins Divider -->
            <div style="display: flex; align-items: center; margin: 32px 0 24px;">
                <hr style="flex: 1; border: none; border-top: 1px solid var(--gold-translucent);">
                <span style="font-size: 12px; color: var(--text-muted); padding: 0 16px; text-transform: uppercase;">Or Register with</span>
                <hr style="flex: 1; border: none; border-top: 1px solid var(--gold-translucent);">
            </div>

            <!-- SSO Buttons -->
            <div style="display: flex; gap: 16px;">
                <button id="sso-reg-google" class="btn-secondary" style="flex: 1; font-size: 13px; text-transform: none; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    Google
                </button>
                <button id="sso-reg-facebook" class="btn-secondary" style="flex: 1; font-size: 13px; text-transform: none; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    Facebook
                </button>
            </div>

            <!-- Switch to Login Link -->
            <div style="text-align: center; margin-top: 32px; font-size: 14px;">
                <span style="color: var(--text-muted);">Already possess an account?</span>
                <a href="login.html" style="font-weight: 600; margin-left: 6px;">Sign In Here</a>
            </div>
        </div>
    </main>

    <!-- Footer Copyright Only -->
    <footer style="text-align: center; padding: 24px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--gold-translucent);">
        &copy; 2026 Genius Malawi. All secure rights reserved.
    </footer>

    <!-- Scripts -->
    <script type="module" src="../js/register.js"></script>
</body>
</html>
